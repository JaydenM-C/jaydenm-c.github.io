{% include base_path %}

<!-- start custom head snippets -->

<!-- Dark theme: decide before first paint, so dark-mode readers don't get a
     flash of the light page. Same rule as assets/js/_main.js: a saved choice
     from the toggle wins, otherwise follow the OS setting. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  })();
</script>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#284958"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


{% comment %} Maths: MathJax is not loaded site-wide (no page uses it). For a post
   with equations, add `math: true` to its front matter. {% endcomment %}
{% if page.math %}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<!-- Typography: Newy Sunsets — self-hosted (see _sass/_fonts.scss).
     Preload the two faces every page renders above the fold. -->
<link rel="preload" href="{{ base_path }}/assets/fonts/newy-sunsets/newsreader-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ base_path }}/assets/fonts/newy-sunsets/jost-var-latin.woff2" as="font" type="font/woff2" crossorigin>

<!-- end custom head snippets -->
